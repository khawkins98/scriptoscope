name: CI

on:
  push:
    branches: [main, v2]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [main, v2]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gates + build + browser contracts
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          # The engine diff gate compares against the baselines at the PR merge-base.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # v2 PLAN §6 diff gate: renders the tests/engine-diff matrix (window chrome and
      # scroll bar, every archive, sampled states and sizes) in Node and compares each
      # cell's trace digest with the baselines at the base. A changed cell must be
      # blessed in tests/engine-diff/expected/<family>.json with a spec rule id, and
      # its family declared by an `engine-diff: <family>` line in the PR body (pushes
      # count families whose expected/baselines files changed). When the PR edits
      # tests/engine-diff/cases.mjs, the base copy of the harness also runs on the head
      # runtime. Node only; seconds.
      - name: Engine diff gate (Node trace diff)
        # The Playwright container's default shell is sh, which has no pipefail.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # PRs into main and into v2 both compare against the merge-base with their
          # base branch (a PR into a branch with no engine-diff baselines seeds them,
          # which requires declaring each family in the PR body).
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base="$(git merge-base HEAD "origin/$BASE_REF")"
            ENGINE_DIFF_PR_BODY="$PR_BODY" node tests/engine-diff/run.mjs --check --base-commit "$base"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags origin "$BEFORE"
            node tests/engine-diff/run.mjs --check --base-commit "$BEFORE" --declared-from-diff
          else
            node tests/engine-diff/run.mjs --check
          fi

      # Bake the gitignored per-theme derivatives (theme.json + cicns/ +
      # ppats/ + icons/ + resource-roles.json + extraction-manifest.json).
      # Bundles ship source-of-truth only (.sit/.rsrc + meta.json); the
      # derivatives are produced on-demand and consumed by `audit:scenes`.
      # All pure Node — see the "Option A" block in CLAUDE.md Architecture.
      - name: Bake theme derivatives (required by audit:scenes)
        run: npm run build:themes

      # Build the library FIRST. `lint:themes --strict` re-decodes every
      # bundle and imports PixelBuffer from `dist/scriptoscope.js` to do
      # so — on a fresh CI checkout, dist/ does not exist yet. Locally the
      # maintainer's pre-push `npm run gates` works because they typically
      # have a stale `dist/` from prior dev. Order matters on a clean tree.
      - name: Library build
        run: npm run build

      # The Pages demo and the public /theme-loader/ wrapper build (no deploy, no upload).
      # Without this the Pages deploy is the first place a broken demo or loader build
      # shows up. build:demo re-runs the library build first; that is a few seconds.
      - name: Demo and loader build (Pages bundle, not deployed)
        run: npm run build:demo

      # The maintainer-defined pre-push umbrella — typecheck + test +
      # lint:themes --strict + audit:scenes --check. All four are pure
      # Node (no browser / canvas / Puppeteer), so they're CI-safe as-is
      # and catch what's statically detectable: TS errors, decoder
      # regressions, re-decode drift against the source-archive sha256
      # baseline, and any Scene slot dropping to its hard fallback.
      # Mirrors `npm run gates` locally — see CLAUDE.md "Commands".
      - name: Gates (typecheck + test + lint --strict + audit --check)
        run: npm run gates

      # Install only the tarball into a separate consumer, typecheck its public
      # exports, and exercise its production browser build with no source alias.
      - name: Installed package consumer contract
        run: npm run test:package

      - name: Browser button activation regression
        run: node --test tests/visual-baselines/button-activation.spec.mjs

      # The immutable Linux image and exact Playwright package pin Chromium. Browser
      # coverage exercises real consumer DOM and the built public entry as well
      # as raw source pixels; gates alone cannot see CSS decoration regressions.
      - name: Rendering option contracts (bounded corpus matrix)
        run: npm run test:rendering

      - name: Reviewed rendering goldens (exact Linux comparison)
        run: npm run test:rendering:goldens

      # Fidelity assessments are reviewed data; execution is a separate column.
      # Require the exact registered source/built assertions to have actually run.
      - name: Validate fidelity requirements and report executions
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPTOSCOPE_GIT_COMMIT: ${{ github.sha }}
        run: npm run test:requirements -- --check-issues --require-execution

      - name: Upload compact rendering observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-observations-${{ github.run_attempt }}
          path: |
            test-results/rendering-evidence/
            tests/rendering-options/goldens/manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload rendering failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-options-${{ github.run_attempt }}
          path: |
            test-results/rendering-options/
            playwright-report/rendering-options/
            test-results/rendering-failure-archive/
          if-no-files-found: ignore
          retention-days: 14
