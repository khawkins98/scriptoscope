<!-- Layout for demo/authoring-preview.html?layout=/authoring/preview-layouts/sizes.html
     Windows at different sizes, a long title and an ACTIVE scrolling window, to
     check that tiles, plates and corners hold up as a frame grows and shrinks. -->
<article data-scriptoscope-window data-scriptoscope-title="Scroller" data-scriptoscope-x="24" data-scriptoscope-y="24"
  data-scriptoscope-width="300" data-scriptoscope-height="180">
  <div class="pad" style="width: 520px">
    <p>An active window whose content overflows both ways, so the active scrollbar art shows.</p>
    <p>Line 2</p><p>Line 3</p><p>Line 4</p><p>Line 5</p><p>Line 6</p><p>Line 7</p><p>Line 8</p>
  </div>
</article>
<article data-scriptoscope-window data-scriptoscope-title="Keep" data-scriptoscope-x="360" data-scriptoscope-y="24"
  data-scriptoscope-width="150" data-scriptoscope-height="70" data-scriptoscope-state="inactive">
  <div class="pad">small</div>
</article>
<article data-scriptoscope-window data-scriptoscope-title="A rather long window title that has to be cut short somewhere"
  data-scriptoscope-x="540" data-scriptoscope-y="24" data-scriptoscope-width="260" data-scriptoscope-height="70" data-scriptoscope-state="inactive">
  <div class="pad">long title</div>
</article>
<article data-scriptoscope-window data-scriptoscope-title="A wide window" data-scriptoscope-x="24" data-scriptoscope-y="250"
  data-scriptoscope-width="776" data-scriptoscope-height="200" data-scriptoscope-state="inactive">
  <div class="pad">large: tiles should repeat cleanly and corners stay put</div>
</article>
<article data-scriptoscope-window data-scriptoscope-title="Palette" data-scriptoscope-window-type="titled-utility-window"
  data-scriptoscope-x="24" data-scriptoscope-y="520" data-scriptoscope-width="180" data-scriptoscope-height="90" data-scriptoscope-state="inactive">
  <div class="pad">utility</div>
</article>
<article data-scriptoscope-window data-scriptoscope-window-type="alert"
  data-scriptoscope-x="240" data-scriptoscope-y="520" data-scriptoscope-width="140" data-scriptoscope-height="60" data-scriptoscope-state="inactive">
  <div class="pad">tiny alert</div>
</article>
<article data-scriptoscope-window data-scriptoscope-title="Modal" data-scriptoscope-window-type="movable-modal"
  data-scriptoscope-x="420" data-scriptoscope-y="520" data-scriptoscope-width="200" data-scriptoscope-height="80" data-scriptoscope-state="inactive">
  <div class="pad">movable modal</div>
</article>
