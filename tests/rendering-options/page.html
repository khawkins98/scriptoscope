<!doctype html>
<meta charset="utf-8">
<title>Scriptoscope control matrix</title>
<style>
  :root { color-scheme: light; }
  body { margin: 16px; background: #ddd; color: #111; font: 12px system-ui, sans-serif; }
  #status { margin-bottom: 12px; }
  #matrix { display: grid; grid-template-columns: repeat(3, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .matrix-case { border: 1px solid #999; background: #f5f5f5; padding: 12px; min-width: 0; }
  .matrix-case h2 { font: 600 12px system-ui; margin: 0 0 8px; overflow-wrap: anywhere; }
  .matrix-output { padding: 12px; background: repeating-conic-gradient(#ddd 0% 25%, #eee 0% 50%) 0/12px 12px; min-height: 40px; overflow: visible; }
  .matrix-control { display: block; position: relative; margin-bottom: 12px; }
  .matrix-window { margin-top: 12px; }
  .matrix-references { display: flex; flex-wrap: wrap; align-items: start; gap: 8px; margin-top: 10px; }
  .matrix-references figure { margin: 0; max-width: 100%; overflow-wrap: anywhere; font-size: 10px; }
  .matrix-references canvas { image-rendering: pixelated; background: #e2e2e2; }
  canvas { image-rendering: pixelated; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 10px monospace; }
</style>
<div id="status" role="status">Loading built runtime and bundled fonts…</div>
<main id="matrix"></main>
<script type="module" src="./browser.mjs"></script>
